<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Digital Stamp Rally</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>

  <style>
    html, body { 
      font-family: 'Prompt', sans-serif; 
      margin: 0; 
      padding: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden; 
      background-color: #f3f4f6; 
    }
    iframe {
      width: 100%;
      height: 100%;
      height: 100dvh;
      border: none;
      display: block;
    }
  </style>
</head>
<body>

  <!-- 🟢 หน้าจอตรวจจับ IN-APP BROWSER 🟢 -->
  <div id="inAppWarning" class="hidden absolute inset-0 z-[200] bg-gradient-to-br from-blue-100 via-pink-100 to-purple-100 text-gray-800 flex flex-col items-center justify-center p-6 text-center">
    <div class="animate__animated animate__bounceIn w-full max-w-sm bg-white/90 backdrop-blur-md p-7 rounded-3xl shadow-2xl border border-white/50">
      <div class="text-6xl mb-4">🥺</div>
      <h2 class="text-2xl font-bold mb-2 text-pink-500">อุ๊ย! แอบเขิน เปิดลิงก์ในเว็บบราวเซอร์น้า</h2>
      <p class="text-gray-600 text-sm mb-6 leading-relaxed">
        เปิดในแอปนี้ระบบจะไม่ให้เข้าถึงแผนที่น้า<br>รบกวนเปิดในเบราว์เซอร์ของเครื่องเพื่อล่าแสตมป์นะคะ ✨
      </p>
      
      <div class="flex flex-col gap-3 w-full mb-6">
        <!-- ส่ง this เข้าไปในฟังก์ชัน เพื่อให้เปลี่ยนหน้าตาปุ่มได้ -->
        <button id="btnChrome" onclick="forceOpenChrome(this)" class="w-full bg-blue-500 text-white font-bold py-3.5 rounded-2xl flex items-center justify-center gap-2 hover:bg-blue-600 active:scale-95 transition shadow-lg shadow-blue-500/30">
          <svg class="w-6 h-6" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg"><path d="M12 2C6.48 2 2 6.48 2 12C2 17.52 6.48 22 12 22C17.52 22 22 17.52 22 12C22 6.48 17.52 2 12 2ZM12 4.14C14.07 4.14 15.93 4.94 17.33 6.26L12.22 15.11C11.39 15.17 10.55 14.86 10 14.28L6.47 8.16C7.88 5.76 9.8 4.14 12 4.14ZM4.14 12C4.14 9.4 5.21 7.07 7.04 5.56L12.3 14.65C12.55 15.08 12.98 15.35 13.5 15.35H7.72C5.55 15.35 4.14 13.78 4.14 12ZM12 19.86C9.52 19.86 7.33 18.57 6 16.5H13.5C14.6 16.5 15.5 15.6 15.5 14.5V11.23L19.26 17.75C17.84 19.06 15.02 19.86 12 19.86Z"/></svg>
          ลองเปิดใน Google Chrome
        </button>

        <button id="btnCopy" onclick="copyToClipboard(this)" class="w-full bg-pink-400 text-white font-bold py-3.5 rounded-2xl flex items-center justify-center gap-2 hover:bg-pink-500 active:scale-95 transition shadow-lg shadow-pink-400/30">
          <i class="ph-bold ph-copy text-xl"></i> คัดลอกลิงก์ไปเปิดเอง
        </button>
      </div>
      
      <div class="bg-blue-50 p-4 rounded-xl border border-blue-100 text-left">
        <p class="text-sm font-semibold text-blue-700 mb-1">🍎 สำหรับ iPhone / iPad หรือแอปไม่เด้ง:</p>
        <p class="text-xs text-gray-600">1. แตะที่ไอคอน <strong class="text-blue-800">จุด 3 จุด (⋯)</strong> มุมจอ</p>
        <p class="text-xs text-gray-600">2. เลือก <strong class="text-blue-800">"เปิดในเบราว์เซอร์"</strong> หรือ Safari ได้เลยจ้า</p>
      </div>
    </div>
  </div>

  <iframe 
    src="https://script.google.com/macros/s/AKfycbxHrb2sSfHr_gDRifotbuQq9l1hvW7orU-5qgvhZUKR2thStXRRbmjdB_gJvKvKDkrt/exec" 
    allow="geolocation"
  ></iframe>

  <script>
    document.addEventListener("DOMContentLoaded", function() {
      const ua = navigator.userAgent || navigator.vendor || window.opera;
      const isLine = (ua.indexOf("Line") > -1);
      const isFB = (ua.indexOf("FBAN") > -1) || (ua.indexOf("FBAV") > -1) || (ua.indexOf("Instagram") > -1);
      
      const inAppWarning = document.getElementById('inAppWarning');
      
      if (isLine || isFB) {
        if (isLine && window.location.href.indexOf('openExternalBrowser=1') === -1) {
          const currentUrl = window.location.href;
          window.location.href = currentUrl + (currentUrl.indexOf('?') > -1 ? '&' : '?') + 'openExternalBrowser=1';
          return; 
        }

        inAppWarning.classList.remove('hidden');
        
        // Android ไม่ต้องเด้งเองแล้ว ให้ผู้ใช้กดปุ่มเองเพื่อป้องกันจอนิ่ง
      }
    });

    // เปลี่ยนแปลงหน้าตาปุ่มแทนการใช้ alert()
    function forceOpenChrome(btn) {
      const ua = navigator.userAgent || navigator.vendor || window.opera;
      const rawUrl = window.location.href;
      const cleanUrl = rawUrl.replace(/^https?:\/\//i, "");

      // พยายามเด้ง
      try {
        if (/android/i.test(ua)) {
          window.location.href = "intent://" + cleanUrl + "#Intent;scheme=https;package=com.android.chrome;end";
        } else {
          window.location.href = "googlechrome://" + cleanUrl;
        }
      } catch (e) {
        console.log("Redirect error", e);
      }

      // เซ็ตสถานะปุ่มกำลังโหลด
      const originalHTML = btn.innerHTML;
      btn.innerHTML = '<i class="ph-bold ph-spinner animate-spin text-xl"></i> กำลังลองเปิด...';
      
      // ถ้าผ่านไป 1.5 วิ แล้วเฟสบุ๊กบล็อก (หน้าไม่ยอมปิด) ให้เปลี่ยนปุ่มเป็นสีแดงแจ้งเตือน
      setTimeout(() => {
        btn.classList.remove('bg-blue-500', 'hover:bg-blue-600');
        btn.classList.add('bg-red-500', 'hover:bg-red-600');
        btn.innerHTML = '<i class="ph-bold ph-warning text-xl"></i> เฟสบุ๊กบล็อก! ให้กดจุด 3 จุดมุมจอแทนฮะ 👇';
        
        // คืนค่าปุ่มกลับเป็นเหมือนเดิมหลังผ่านไป 5 วินาที
        setTimeout(() => {
          btn.classList.remove('bg-red-500', 'hover:bg-red-600');
          btn.classList.add('bg-blue-500', 'hover:bg-blue-600');
          btn.innerHTML = originalHTML;
        }, 5000);
      }, 1500);
    }

    // อัปเดตระบบก๊อปปี้ให้รองรับ Facebook WebView และเปลี่ยนปุ่มแทน alert()
    function copyToClipboard(btn) {
      const textToCopy = window.location.href;
      
      // ฟังก์ชันเมื่อก๊อปปี้สำเร็จ (เปลี่ยนปุ่มเป็นสีเขียว)
      const successCopy = () => {
        const originalHTML = btn.innerHTML;
        btn.classList.remove('bg-pink-400', 'hover:bg-pink-500');
        btn.classList.add('bg-emerald-500', 'hover:bg-emerald-600');
        btn.innerHTML = '<i class="ph-bold ph-check-circle text-xl"></i> ก๊อปปี้ลิงก์สำเร็จ! 🎉';
        
        setTimeout(() => {
          btn.classList.remove('bg-emerald-500', 'hover:bg-emerald-600');
          btn.classList.add('bg-pink-400', 'hover:bg-pink-500');
          btn.innerHTML = originalHTML;
        }, 3000);
      };

      // พยายามก๊อปปี้ด้วยวิธีใหม่
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(textToCopy).then(successCopy).catch(fallbackCopy);
      } else {
        fallbackCopy();
      }

      // วิธีสำรอง (Fallback) สำหรับ Facebook
      function fallbackCopy() {
        const dummy = document.createElement('textarea');
        dummy.value = textToCopy;
        dummy.style.position = 'fixed'; // ป้องกันจอเด้งเวลาโฟกัส
        dummy.style.opacity = '0';
        document.body.appendChild(dummy);
        dummy.focus();
        dummy.select();
        try {
          document.execCommand('copy');
          successCopy();
        } catch (err) {
          console.error('Copy failed', err);
          btn.innerHTML = '❌ คัดลอกไม่ได้ ให้กดจุด 3 จุดแทน';
        }
        document.body.removeChild(dummy);
      }
    }
  </script>
</body>
</html>
