<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Digital Stamp Rally</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>

  <style>
    /* 🟢 ใช้ dvh เพื่อป้องกันจอมือถือบังขอบบนและขอบล่าง 🟢 */
    html, body { 
      font-family: 'Prompt', sans-serif; 
      margin: 0; 
      padding: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden; 
      background-color: #f3f4f6; 
    }
    iframe {
      width: 100%;
      height: 100%;
      height: 100dvh;
      border: none;
      display: block;
    }
  </style>
</head>
<body>

  <!-- 🟢 หน้าจอตรวจจับ IN-APP BROWSER (เปิดจาก LINE / Facebook) 🟢 -->
  <div id="inAppWarning" class="hidden absolute inset-0 z-[200] bg-gray-900 text-white flex flex-col items-center justify-center p-6 text-center">
    <div class="animate__animated animate__bounceIn w-full max-w-sm">
      <i class="ph-fill ph-warning text-yellow-400 text-7xl mb-4"></i>
      <h2 class="text-2xl font-bold mb-2">การกดลิงก์ผ่านเฟสบุ๊ก/ไลน์ ไม่สามารถใช้ GPS ได้</h2>
      <p class="text-gray-300 text-sm mb-6 leading-relaxed">
        ระบบโซเชียลบล็อกการเข้าถึงแผนที่<br>กรุณากดเปิดผ่านเบราว์เซอร์หลักของเครื่องหรือสแกน QR Code เพื่อทำภารกิจ
      </p>
      
      <div class="flex flex-col gap-3 w-full mb-6">
        <button onclick="forceOpenChrome()" class="w-full bg-blue-600 text-white font-bold py-3.5 rounded-xl flex items-center justify-center gap-2 hover:bg-blue-700 active:scale-95 transition shadow-lg shadow-blue-500/30">
          <svg class="w-6 h-6" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg"><path d="M12 2C6.48 2 2 6.48 2 12C2 17.52 6.48 22 12 22C17.52 22 22 17.52 22 12C22 6.48 17.52 2 12 2ZM12 4.14C14.07 4.14 15.93 4.94 17.33 6.26L12.22 15.11C11.39 15.17 10.55 14.86 10 14.28L6.47 8.16C7.88 5.76 9.8 4.14 12 4.14ZM4.14 12C4.14 9.4 5.21 7.07 7.04 5.56L12.3 14.65C12.55 15.08 12.98 15.35 13.5 15.35H7.72C5.55 15.35 4.14 13.78 4.14 12ZM12 19.86C9.52 19.86 7.33 18.57 6 16.5H13.5C14.6 16.5 15.5 15.6 15.5 14.5V11.23L19.26 17.75C17.84 19.06 15.02 19.86 12 19.86Z"/></svg>
          เปิดใน Google Chrome
        </button>

        <button onclick="copyToClipboard()" class="w-full bg-gray-700 text-white font-bold py-3.5 rounded-xl flex items-center justify-center gap-2 hover:bg-gray-600 active:scale-95 transition">
          <i class="ph-bold ph-copy text-xl"></i> คัดลอกลิงก์ (นำไปวางใน Safari)
        </button>
      </div>
      
      <div class="bg-white/10 p-4 rounded-xl border border-white/20 text-left">
        <p class="text-sm font-semibold text-yellow-300 mb-1">🍎 สำหรับผู้ใช้ iPhone / iPad:</p>
        <p class="text-xs text-gray-200">1. กดที่ไอคอน <strong class="text-white">จุด 3 จุด (⋯)</strong> มุมจอ</p>
        <p class="text-xs text-gray-200">2. เลือก <strong class="text-white">"เปิดในเบราว์เซอร์"</strong> หรือ Safari</p>
      </div>
    </div>
  </div>


  <!-- 🟢 ไอเฟรมหลักของระบบ Rally 🟢 -->
  <iframe 
    src="https://script.google.com/macros/s/AKfycbxHrb2sSfHr_gDRifotbuQq9l1hvW7orU-5qgvhZUKR2thStXRRbmjdB_gJvKvKDkrt/exec" 
    allow="geolocation"
  ></iframe>


  <script>
    document.addEventListener("DOMContentLoaded", function() {
      const ua = navigator.userAgent || navigator.vendor || window.opera;
      const isLine = (ua.indexOf("Line") > -1);
      const isFB = (ua.indexOf("FBAN") > -1) || (ua.indexOf("FBAV") > -1) || (ua.indexOf("Instagram") > -1);
      
      const inAppWarning = document.getElementById('inAppWarning');
      
      if (isLine || isFB) {
        inAppWarning.classList.remove('hidden');
        if (/android/i.test(ua)) {
          forceOpenChrome();
        }
      }
    });

    function forceOpenChrome() {
      const currentUrl = window.location.href.replace(/^https?:\/\//i, "");
      const ua = navigator.userAgent || navigator.vendor || window.opera;
      
      if (/android/i.test(ua)) {
        window.location.href = "intent://" + currentUrl + "#Intent;scheme=https;package=com.android.chrome;end";
      } else {
        window.location.href = "googlechrome://" + currentUrl;
        setTimeout(() => {
          alert("ไม่พบแอป Chrome ในเครื่อง กรุณากดปุ่ม 3 จุดมุมขวาบน แล้วเลือก 'เปิดใน Safari' แทนนะครับ");
        }, 1500);
      }
    }

    function copyToClipboard() {
      const dummy = document.createElement('input'), text = window.location.href;
      document.body.appendChild(dummy);
      dummy.value = text;
      dummy.select();
      document.execCommand('copy');
      document.body.removeChild(dummy);
      
      alert("✅ คัดลอกลิงก์เรียบร้อยแล้ว!\n\nกรุณาสลับไปเปิดแอป Safari หรือ Chrome แล้ววางลิงก์เพื่อเข้าใช้งานได้เลยครับ");
    }
  </script>
</body>
</html>
